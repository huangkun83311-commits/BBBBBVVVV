name: build-bs-unlock

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Theos + 工具链 + SDK
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot rsync curl perl zip unzip git libxml2-utils libtinfo6 dpkg xz-utils

          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

          # 1) theos 本体
          if [ ! -d "$THEOS/makefiles" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          fi

          # 2) Linux 工具链（官方脚本用的就是这个）
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
              | tar -xJ -C "$THEOS/toolchain/"
          fi

          # 3) SDK
          mkdir -p "$THEOS/sdks"
          if ! ls "$THEOS"/sdks/*.sdk >/dev/null 2>&1; then
            "$THEOS/bin/install-sdk" latest || true
          fi
          if ! ls "$THEOS"/sdks/*.sdk >/dev/null 2>&1; then
            git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
            cp -r /tmp/sdks/*.sdk "$THEOS/sdks/"
          fi

      - name: 环境检查
        run: |
          echo "THEOS=$THEOS"
          ls -1 "$THEOS/toolchain/linux/iphone/bin" | head -8
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -2
          ls -1 "$THEOS/sdks"
          which ldid || ls -l "$THEOS/bin/ldid" || true

      - name: 编译
        run: |
          set -o pipefail
          make clean > /dev/null 2>&1 || true
          make -j"$(nproc)" FINALPACKAGE=1 2>&1 | tee build.log

      - name: 失败回推日志
        if: failure()
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          tail -c 20000 build.log > build.tail 2>/dev/null || true
          git checkout -B ci-log
          git add -f build.tail
          git commit -m "ci log $(date -u +%H:%M:%S)" || true
          git push -f origin ci-log || true

      - name: 签名
        run: |
          D=$(find .theos -name "bs_unlock.dylib" | head -1)
          echo "dylib = $D"
          ldid -S bs_unlock.ent.plist "$D"
          ldid -l "$D" | head -20 || true

      - name: 打 deb
        continue-on-error: true
        run: make package FINALPACKAGE=1

      - name: 收集产物
        run: |
          mkdir -p out
          find .theos -name "bs_unlock.dylib" -exec cp {} out/ \;
          cp bs_unlock.plist bs_unlock.ent.plist out/ 2>/dev/null || true
          find . -maxdepth 3 -name "*.deb" -exec cp {} out/ \;
          ls -l out

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: bs_unlock-build
          path: out/
          if-no-files-found: error
