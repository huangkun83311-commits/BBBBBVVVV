name: build-bs-unlock

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Theos + iOS SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make git curl zip unzip fakeroot dpkg libplist-utils
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -r /tmp/sdks/*.sdk "$THEOS/sdks/" 2>/dev/null || true
          ls -1 "$THEOS/sdks"
          "$THEOS/bin/ldid" -h >/dev/null 2>&1 && echo "ldid 可用" || echo "ldid 缺失"

      - name: 环境检查
        run: |
          echo "THEOS=$THEOS"
          ls -1 "$THEOS/sdks" || true
          make --version | head -1
          ldid -h 2>&1 | head -2 || true

      - name: 编译
        run: |
          make clean || true
          make -j"$(nproc)" FINALPACKAGE=1
          find .theos -name "bs_unlock.dylib" -ls

      - name: 签名（复用原包 entitlements）
        run: |
          D=$(find .theos -name "bs_unlock.dylib" | head -1)
          echo "dylib = $D"
          ldid -S bs_unlock.ent.plist "$D"
          ldid -l "$D" | head -30 || true

      - name: 打 deb（可选，失败不影响 dylib）
        continue-on-error: true
        run: make package FINALPACKAGE=1

      - name: 收集产物
        run: |
          mkdir -p out
          find .theos -name "bs_unlock.dylib" -exec cp {} out/ \;
          cp bs_unlock.plist bs_unlock.ent.plist out/ 2>/dev/null || true
          find . -maxdepth 3 -name "*.deb" -exec cp {} out/ \;
          ls -l out

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: bs_unlock-build
          path: out/
          if-no-files-found: error
